name: Publicar Homologação

on:
  push:
    branches:
      - homolog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-homolog:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar branch homolog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Verificar configuração SuperDB
        env:
          VITE_SUPERDB_ANON_KEY: ${{ secrets.VITE_SUPERDB_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPERDB_ANON_KEY" ]; then
            echo "ERRO: VITE_SUPERDB_ANON_KEY não foi recebida."
            exit 1
          fi

          echo "OK: VITE_SUPERDB_ANON_KEY disponível para o build."

      - name: Gerar build de homologação
        env:
          VITE_SUPERDB_ANON_KEY: ${{ secrets.VITE_SUPERDB_ANON_KEY }}
        run: npm run build

      - name: Completar arquivos estáticos
        run: |
          mkdir -p dist/assets

          cp -rn assets/css dist/assets/ 2>/dev/null || true
          cp -rn assets/img dist/assets/ 2>/dev/null || true
          cp -rn assets/images dist/assets/ 2>/dev/null || true
          cp -rn assets/icons dist/assets/ 2>/dev/null || true

          mkdir -p dist/assets/js

          find assets/js -type f ! -name "superdb-client-loader.js" | while read file; do
            destino="dist/$file"
            mkdir -p "$(dirname "$destino")"

            if [ ! -e "$destino" ]; then
              cp "$file" "$destino"
            fi
          done

      - name: Verificar arquivos da homologação
        run: |
          test -f dist/index.html
          test -f dist/assets/js/core/config.js
          test -f dist/assets/js/services/logger.js
          test -f dist/assets/js/services/backend-client.js
          test -f dist/assets/js/services/history-service.js
          test -f dist/assets/js/services/online-sync-service.js
          test -f dist/assets/js/app.js

          echo "OK: arquivos estáticos necessários estão presentes."

      - name: Publicar no repositório de homologação
        env:
          HOMOLOG_TOKEN: ${{ secrets.HOMOLOG_REPO_TOKEN }}
        run: |
          cd dist

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "publica homologacao"

          git remote add homolog-pages \
            https://x-access-token:${HOMOLOG_TOKEN}@github.com/edualvesanjos/Utilitarios-Municipais-Homolog.git

          git push homolog-pages HEAD:main --force
